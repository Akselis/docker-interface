---
- hosts: "{{ target_host }}"
  become: true
  gather_facts: true

  vars:
    docker_users: []
    apt_update_cache: false

  pre_tasks:
    - name: Ensure target is Debian-family (Debian/Ubuntu/Linux Mint)
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_distribution | lower in ["debian", "ubuntu", "linux mint", "linuxmint"]
        fail_msg: "This playbook supports Debian-family hosts (Debian/Ubuntu/Linux Mint)."
        success_msg: "Supported OS detected: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  tasks:
    - name: Check whether Docker CLI is already available
      ansible.builtin.command: docker --version
      register: docker_cli_check
      changed_when: false
      failed_when: false

    - name: Check whether Docker Compose plugin is already available
      ansible.builtin.command: docker compose version
      register: docker_compose_check
      changed_when: false
      failed_when: false

    - name: Check whether Docker daemon is reachable
      ansible.builtin.command: docker info
      register: docker_daemon_check
      changed_when: false
      failed_when: false

    - name: Detect containerized local execution
      ansible.builtin.set_fact:
        manage_docker_service: >-
          {{
            not (
              (ansible_connection | default('')) == 'local'
              and (ansible_virtualization_type | default('')) in ['docker', 'containerd', 'podman']
            )
          }}

    - name: Ensure docker daemon is reachable in containerized local execution
      ansible.builtin.assert:
        that:
          - docker_daemon_check.rc == 0
        fail_msg: >-
          Docker daemon is not reachable from this environment.
          If running CLI in a container, mount /var/run/docker.sock and retry.
      when: not manage_docker_service

    - name: Install Docker engine from distro packages when missing
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: "{{ apt_update_cache }}"
      when:
        - manage_docker_service
        - docker_cli_check.rc != 0

    - name: Install Docker Compose plugin when missing
      when:
        - manage_docker_service
        - docker_compose_check.rc != 0
      block:
        - name: Install docker-compose-plugin
          ansible.builtin.apt:
            name: docker-compose-plugin
            state: present
            update_cache: false
      rescue:
        - name: Fallback install docker-compose-v2
          ansible.builtin.apt:
            name: docker-compose-v2
            state: present
            update_cache: false
          ignore_errors: true

        - name: Fallback install docker-compose (legacy)
          ansible.builtin.apt:
            name: docker-compose
            state: present
            update_cache: false
          ignore_errors: true

    - name: Ensure Docker service is enabled and started
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      when: manage_docker_service

    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: docker_users | length > 0

    - name: Show docker version
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Show docker compose version
      ansible.builtin.command: docker compose version
      register: docker_compose_version
      changed_when: false
      failed_when: false

    - name: Print docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Print docker compose version
      ansible.builtin.debug:
        var: docker_compose_version.stdout

    - name: Validate docker daemon reachability
      ansible.builtin.command: docker info
      register: docker_info_verify
      changed_when: false
      failed_when: docker_info_verify.rc != 0

    - name: Print docker server info summary
      ansible.builtin.debug:
        msg: "Docker daemon reachable on {{ target_host }}"
      when: docker_info_verify.rc == 0
