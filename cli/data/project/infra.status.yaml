---
- hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_workdir: .
    terraform_workspace: default
    terraform_output_file: data/artifacts/terraform_output.json

  tasks:
    - name: Ensure terraform output directory exists
      ansible.builtin.file:
        path: "{{ terraform_output_file | dirname }}"
        state: directory
        mode: "0755"

    - name: Terraform init
      ansible.builtin.command:
        cmd: terraform init -input=false
        chdir: "{{ terraform_workdir }}"

    - name: Terraform workspace select
      ansible.builtin.command:
        cmd: terraform workspace select {{ terraform_workspace }}
        chdir: "{{ terraform_workdir }}"

    - name: Collect terraform outputs as json
      ansible.builtin.command:
        cmd: terraform output -json
        chdir: "{{ terraform_workdir }}"
      register: terraform_output
      changed_when: false

    - name: Write terraform output json to artifact file
      ansible.builtin.copy:
        dest: "{{ terraform_output_file }}"
        content: "{{ terraform_output.stdout }}"
        mode: "0644"
