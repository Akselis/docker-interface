---
- hosts: "{{ target_host }}"
  become: true
  gather_facts: false

  vars:
    keep_volumes: true

  tasks:
    - name: List all docker containers (running and stopped)
      ansible.builtin.command: docker ps -aq
      register: all_container_ids
      changed_when: false

    - name: Remove all docker containers
      ansible.builtin.command:
        cmd: >-
          docker rm -f
          {% if not keep_volumes %}-v{% endif %}
          {{ item }}
      loop: "{{ all_container_ids.stdout_lines }}"
      when: all_container_ids.stdout_lines | length > 0

    - name: Prune docker volumes when requested
      ansible.builtin.command: docker volume prune -af
      when: not keep_volumes
      changed_when: false
      failed_when: false
