---
- hosts: "{{ target_host }}"
  become: true

  vars:
    lab_host_image: lab-host:latest
    lab_host_container_name: lab-host-api
    lab_host_host_port: 8000
    lab_host_container_port: 8000
    lab_host_compose_dir: /opt/lab_host/compose
    lab_host_restart_policy: unless-stopped
    lab_host_network_name: bridge
    lab_host_port_output_file: ""

  pre_tasks:
    - name: Ensure lab host API key is provided
      ansible.builtin.assert:
        that:
          - lab_host_api_key is defined
          - lab_host_api_key | string | length > 0
        fail_msg: "Set lab_host_api_key when running this playbook."

    - name: Ensure LAB_HOST_ID artifact directory exists on controller
      ansible.builtin.file:
        path: "{{ lab_host_id_output_file | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      when: lab_host_id_output_file is defined and (lab_host_id_output_file | string | length > 0)

    - name: Ensure LAB_HOST_PORT artifact directory exists on controller
      ansible.builtin.file:
        path: "{{ lab_host_port_output_file | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      when: lab_host_port_output_file is defined and (lab_host_port_output_file | string | length > 0)

  tasks:
    - name: Generate LAB_HOST_ID UUID when not provided
      ansible.builtin.command: cat /proc/sys/kernel/random/uuid
      register: generated_lab_host_id
      changed_when: false
      when: lab_host_id is not defined or (lab_host_id | string | length == 0)

    - name: Resolve effective LAB_HOST_ID
      ansible.builtin.set_fact:
        lab_host_effective_id: >-
          {{
            (lab_host_id | string)
            if (lab_host_id is defined and (lab_host_id | string | length > 0))
            else (generated_lab_host_id.stdout | trim)
          }}

    - name: Ensure compose projects directory exists
      ansible.builtin.file:
        path: "{{ lab_host_compose_dir }}"
        state: directory
        mode: "0755"

    - name: Pull lab host API image
      ansible.builtin.command: docker pull {{ lab_host_image }}
      changed_when: true

    - name: Resolve available lab host TCP port
      ansible.builtin.shell: |
        python3 - <<'PY'
        import socket

        start = int("{{ lab_host_host_port }}")
        end = start + 200

        selected = start
        for port in range(start, end + 1):
            sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            try:
                sock.bind(("0.0.0.0", port))
                selected = port
                break
            except OSError:
                continue
            finally:
                sock.close()

        print(selected)
        PY
      register: lab_host_effective_port
      changed_when: false

    - name: Set effective lab host port fact
      ansible.builtin.set_fact:
        lab_host_effective_host_port: "{{ (lab_host_effective_port.stdout | trim) | int }}"

    - name: Run lab host container
      community.docker.docker_container:
        name: "{{ lab_host_container_name }}"
        image: "{{ lab_host_image }}"
        state: started
        restart_policy: "{{ lab_host_restart_policy }}"
        network_mode: "{{ lab_host_network_name }}"
        published_ports:
          - "{{ lab_host_effective_host_port }}:{{ lab_host_container_port }}"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - "{{ lab_host_compose_dir }}:{{ lab_host_compose_dir }}"
        command:
          - uvicorn
          - controller:app
          - --host
          - 0.0.0.0
          - --port
          - "{{ lab_host_container_port }}"
        env:
          DOCKER_INTERFACE_API_KEY: "{{ lab_host_api_key }}"
          COMPOSE_PROJECTS_DIR: "{{ lab_host_compose_dir }}"
          LAB_HOST_ID: "{{ lab_host_effective_id }}"
          RABBITMQ_URL: "{{ lab_host_rabbitmq_url | default('amqp://guest:guest@localhost:5672/%2F') }}"
          RABBITMQ_EXCHANGE: "{{ lab_host_rabbitmq_exchange | default('lab.events') }}"
          HEARTBEAT_INTERVAL_SECONDS: "{{ (lab_host_heartbeat_interval | default(10)) | string }}"

    - name: Persist effective LAB_HOST_ID to local artifact
      ansible.builtin.copy:
        dest: "{{ lab_host_id_output_file }}"
        content: "{{ lab_host_effective_id }}"
        mode: "0644"
      delegate_to: localhost
      when: lab_host_id_output_file is defined and (lab_host_id_output_file | string | length > 0)

    - name: Persist effective LAB_HOST_PORT to local artifact
      ansible.builtin.copy:
        dest: "{{ lab_host_port_output_file }}"
        content: "{{ lab_host_effective_host_port | string }}"
        mode: "0644"
      delegate_to: localhost
      when: lab_host_port_output_file is defined and (lab_host_port_output_file | string | length > 0)

    - name: Show effective LAB_HOST_ID
      ansible.builtin.debug:
        msg: "LAB_HOST_ID={{ lab_host_effective_id }}"

    - name: Show effective LAB_HOST_PORT
      ansible.builtin.debug:
        msg: "LAB_HOST_PORT={{ lab_host_effective_host_port }}"
