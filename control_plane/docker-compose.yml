services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_plane -d control_plane"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: ./Dockerfile
    working_dir: /app/control_plane
    environment:
      DB_URL: postgresql+asyncpg://control_plane:control_plane@db:5432/control_plane
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/control_plane/scripts/migrate.sh"]
    volumes:
      - ./alembic:/app/control_plane/alembic
      - ./alembic.ini:/app/control_plane/alembic.ini
      - ./scripts:/app/control_plane/scripts
      - ./db/models:/app/control_plane/db/models
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  control_plane:
    build:
      context: .
      dockerfile: ./Dockerfile
    working_dir: /app/control_plane
    environment:
      DB_URL: postgresql+asyncpg://control_plane:control_plane@db:5432/control_plane
      DOCKER_INTERFACE_API_KEY: your-key
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBITMQ_EXCHANGE: lab.events
      RABBITMQ_QUEUE: control_plane.heartbeats
      RABBITMQ_ROUTING_KEY_PATTERN: heartbeat.*
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      ["uvicorn", "controller:app", "--host", "0.0.0.0", "--port", "8001"]

volumes:
  db_data:
  pgadmin_data:
